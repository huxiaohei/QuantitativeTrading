{% extends "public_base.html" %}
{% block title %}注册 · 量化信号{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>注册</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>邮箱
      <input type="email" name="email" value="{{ email }}" autocomplete="email" required>
    </label>
    <label>密码
      <input type="password" name="password" autocomplete="new-password" minlength="{{ min_length }}" maxlength="1024" required>
      <span class="hint">至少 {{ min_length }} 位，不能与邮箱相同。</span>
    </label>
    {% if invite_required %}
    <label>邀请码
      <input type="text" name="invite" value="{{ invite }}" autocomplete="off" required>
    </label>
    {% endif %}
    <label class="check">
      <input type="checkbox" name="accept_terms" value="on" required>
      我已阅读并同意<a href="/terms">《使用条款与风险提示》</a>
    </label>
    <button type="submit" class="primary">注册</button>
  </form>
  <p class="muted">注册后请到邮箱点击验证链接，验证后再登录。</p>
  <p class="links">已有账号？<a href="/login">登录</a></p>
</section>
{% endblock %}
