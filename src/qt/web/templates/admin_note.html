{% extends "base.html" %}
{% block title %}修改备注 · 管理 · 量化信号{% endblock %}
{% block content %}
<h1>管理</h1>
{% include "_admin_nav.html" %}
<section class="card">
  <h2>修改备注</h2>
  <p>{{ subject }}</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ action }}" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>备注（留空就是去掉备注；只有管理员能看到）
      <input type="text" name="note" value="{{ note }}" maxlength="{{ note_max }}" autocomplete="off">
    </label>
    <div class="actions">
      <button type="submit" class="primary">保存</button>
      <a href="{{ back_url }}">取消</a>
    </div>
  </form>
</section>
{% endblock %}
