{% extends "base.html" %}
{% block title %}设置 · 量化信号{% endblock %}
{% block content %}
<h1>设置</h1>
{% if flash %}<p class="notice">{{ flash }}</p>{% endif %}
<section class="card">
  <h2>邮件</h2>
  <form method="post" action="/settings/mail" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="check">
      <input type="checkbox" name="weekly_mail" value="on"{% if weekly_mail %} checked{% endif %}>
      每周发一封周报邮件
    </label>
    <label class="check">
      <input type="checkbox" name="abandon_mail" value="on"{% if abandon_mail %} checked{% endif %}>
      信号被放弃时发提醒邮件
    </label>
    <button type="submit" class="primary">保存</button>
  </form>
</section>
<section class="card">
  <h2>修改密码</h2>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/settings/password" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>当前密码
      <input type="password" name="current" autocomplete="current-password" maxlength="1024" required>
    </label>
    <label>新密码
      <input type="password" name="new" autocomplete="new-password" maxlength="1024" required>
    </label>
    <button type="submit" class="primary">修改密码</button>
  </form>
  <p class="muted">修改后，其他设备上的登录会失效，需要重新登录；当前浏览器不受影响。</p>
</section>
<section class="card">
  <h2>退出所有设备</h2>
  <p>让这个账号在所有浏览器与设备上退出登录（包括当前这个），之后需要重新登录。</p>
  <form method="post" action="/settings/logout-all" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">退出所有设备</button>
  </form>
</section>
{% endblock %}
