{% extends "public_base.html" %}
{% block title %}登录 · 量化信号{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>登录</h1>
  {% if flash %}<p class="notice">{{ flash }}</p>{% endif %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>邮箱
      <input type="email" name="email" value="{{ email }}" autocomplete="username" required>
    </label>
    <label>密码
      <input type="password" name="password" autocomplete="current-password" maxlength="1024" required>
    </label>
    <button type="submit" class="primary">登录</button>
  </form>
  {% if unverified %}
  <form method="post" action="/verify/resend" class="form resend">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="email" value="{{ email }}">
    <p>没有收到验证邮件？</p>
    <button type="submit">重新发送验证邮件</button>
  </form>
  {% endif %}
  <p class="links"><a href="/forgot">忘记密码</a> · <a href="/register">注册新账号</a></p>
</section>
{% endblock %}
