{% extends "base.html" %}
{% block title %}创建订阅 · 量化信号{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>创建订阅</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/strategy/new" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>起始资金（元）
      <input type="text" name="initial_cash" value="{{ cash }}" inputmode="decimal" required>
      {% if errors.get("initial_cash") %}<span class="field-error" role="alert">{{ errors.get("initial_cash") }}</span>{% endif %}
    </label>
    <label>起始日（可不填）
      <input type="text" name="start_day" value="{{ start }}" placeholder="{{ default_day or 'YYYY-MM-DD' }}" inputmode="numeric">
      <span class="hint">不填则从 {{ default_day or '下一个交易日' }} 开始：交易日 {{ run_time }} 之前创建的当晚第一次运行，之后创建的从下一个交易日开始；也可以填过去的交易日（最早为 {{ limit_days }} 个交易日之前），运行时逐日补算，格式 YYYY-MM-DD。</span>
      {% if errors.get("start_day") %}<span class="field-error" role="alert">{{ errors.get("start_day") }}</span>{% endif %}
    </label>
    <button type="submit" class="primary">创建</button>
  </form>
  <p class="links"><a href="/strategy">返回策略页</a></p>
</section>
{% endblock %}
