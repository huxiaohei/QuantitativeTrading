{% extends "base.html" %}
{% block title %}录入已有持仓 · 量化信号{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>录入已有持仓</h1>
  <p class="muted">{{ board_note }}。已有持仓不扣现金，从下一个交易日起进入净值，记为自主买入。</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/manual/holding" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="form_key" value="{{ form_key }}">
    <label>股票代码
      <input type="text" name="symbol" value="{{ values.get('symbol', '') }}" inputmode="numeric" required>
      {% if errors.get("symbol") %}<span class="field-error" role="alert">{{ errors.get("symbol") }}</span>{% endif %}
    </label>
    <label>买入日
      <input type="text" name="buy_day" value="{{ values.get('buy_day', '') }}" placeholder="YYYY-MM-DD" inputmode="numeric" required>
      {% if errors.get("buy_day") %}<span class="field-error" role="alert">{{ errors.get("buy_day") }}</span>{% endif %}
    </label>
    <label>成本价（元）
      <input type="text" name="cost_price" value="{{ values.get('cost_price', '') }}" inputmode="decimal" required>
      {% if errors.get("cost_price") %}<span class="field-error" role="alert">{{ errors.get("cost_price") }}</span>{% endif %}
    </label>
    <label>股数
      <input type="text" name="shares" value="{{ values.get('shares', '') }}" inputmode="numeric" required>
      {% if errors.get("shares") %}<span class="field-error" role="alert">{{ errors.get("shares") }}</span>{% endif %}
    </label>
    <button type="submit" class="primary">录入</button>
  </form>
  <p class="links"><a href="/manual">返回手动账</a></p>
</section>
{% endblock %}
