{% extends "public_base.html" %}
{% block title %}验证邮箱 · 量化信号{% endblock %}
{% block content %}
<section class="card narrow">
  {% if valid %}
  <h1>验证邮箱</h1>
  <p>点击下面的按钮，确认这个邮箱属于你。</p>
  <form method="post" action="/verify" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="token" value="{{ token }}">
    <button type="submit" class="primary">确认验证</button>
  </form>
  {% else %}
  <h1>链接已使用或已过期</h1>
  <p>如果你已经验证过邮箱，直接登录即可；否则可以在登录页重新发送验证邮件。</p>
  <p class="links"><a href="/login">去登录</a></p>
  {% endif %}
</section>
{% endblock %}
