{# 管理员查看页里一本账的汇总：订阅状态与截至某日的净值、现金、持仓市值、收益 #}
<section class="card">
  <h2>订阅 #{{ sub.id }}（{{ sub.status_label }}），截至 {{ summary.as_of }}</h2>
  <div class="table-wrap">
  <table>
    <tbody>
      <tr><th>净值</th><td class="num">{{ summary.nav | money }}</td></tr>
      <tr><th>现金</th><td class="num">{{ summary.cash | money }}</td></tr>
      <tr><th>持仓市值</th><td class="num">{{ summary.holdings_value | money }}</td></tr>
      <tr><th>收益</th><td class="num {{ (summary.unit_nav - 1) | trend }}">{{ (summary.unit_nav - 1) | pct }}</td></tr>
    </tbody>
  </table>
  </div>
</section>
