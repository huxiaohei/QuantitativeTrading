# 生产/日常运行：数据库 + 后台任务
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: qt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qt}
      POSTGRES_DB: qt
      TZ: Asia/Shanghai
    volumes:
      - qt_pg:/var/lib/postgresql/data
    # 容器网络内用 db:5432；另映射到本机 54330 供管理命令使用，仅监听回环地址
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qt -d qt"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://qt:${POSTGRES_PASSWORD:-qt}@db:5432/qt
      QT_DATA_DIR: /app/data
    volumes:
      - ${QT_DATA_DIR:-./data}:/app/data
    # 任务 10 改为 `qt worker`
    command: ["qt", "--help"]

volumes:
  qt_pg:
