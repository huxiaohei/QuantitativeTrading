# 生产/日常运行：数据库 + 后台任务 + 网页（+ 公网反向代理，仅 public 档位）

# 每个服务共用的日志设置：单个文件最多 10 MB，保留 3 个，防止日志把磁盘写满
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: qt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qt}
      POSTGRES_DB: qt
      TZ: Asia/Shanghai
    volumes:
      - qt_pg:/var/lib/postgresql/data
    # 内存不够时让内核优先杀别的进程，不先杀数据库
    oom_score_adj: -500
    # 容器网络内用 db:5432；另映射到本机 54330 供管理命令使用，仅监听回环地址
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qt -d qt"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 一次性服务：把数据库升级到最新结构，成功后退出；worker 等它成功才启动
  migrate:
    build: .
    logging: *logging
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://qt:${POSTGRES_PASSWORD:-qt}@db:5432/qt
    command: ["alembic", "upgrade", "head"]

  worker:
    build: .
    logging: *logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://qt:${POSTGRES_PASSWORD:-qt}@db:5432/qt
      QT_DATA_DIR: /app/data
      QT_BACKUP_DIR: /app/backups
      MAIL_FILE_DIR: /app/mail_out
    volumes:
      - ${QT_DATA_DIR:-./data}:/app/data
      # 每日运行完成后，worker 把数据库备份写到这里（宿主机 ./backups，不进入 git）
      - ./backups:/app/backups
      # MAIL_BACKEND=file 时，邮件以 .eml 文件写到这里（宿主机 ./mail_out，不进入 git）
      - ./mail_out:/app/mail_out
    # 常驻定时进程：每个交易日 run_time 运行，休眠醒来后补跑，运行完成后备份数据库
    command: ["qt", "worker"]

  # 网页：与 worker 同一镜像；不映射宿主机端口，只在容器网络内被 proxy 访问
  # （本机开发用 compose.dev.yaml 映射到 127.0.0.1:8000）。
  # 网页进程不构建全市场行情面板，按使用者缓存股票集合；800m 是兜底上限
  # （小内存主机上要给夜间运行的 worker 和数据库留出空间）。
  web:
    build: .
    logging: *logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg://qt:${POSTGRES_PASSWORD:-qt}@db:5432/qt
      QT_DATA_DIR: /app/data
      MAIL_FILE_DIR: /app/mail_out
      # .env 里的 HTTP_PROXY / HTTPS_PROXY 会传进容器；回环地址和数据库不应走代理
      NO_PROXY: 127.0.0.1,localhost,db
      no_proxy: 127.0.0.1,localhost,db
    volumes:
      # 行情数据只读：网页不写数据
      - ${QT_DATA_DIR:-./data}:/app/data:ro
      - ./reports:/app/reports:ro
      # MAIL_BACKEND=file 时，网页发的验证邮件也写到这里
      - ./mail_out:/app/mail_out
    command: ["qt", "web", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 800m
    healthcheck:
      # 镜像里没有 curl，用 Python 请求 /healthz；空 ProxyHandler 让请求不受 HTTP_PROXY 影响
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as r; r.build_opener(r.ProxyHandler({})).open('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 公网反向代理（自动申请 HTTPS 证书）：只在 public 档位启动，
  # 服务器上用 docker compose --profile public up -d；本机开发的 docker compose up 不会启动它。
  proxy:
    image: caddy:2
    logging: *logging
    restart: unless-stopped
    profiles: ["public"]
    depends_on:
      - web
    environment:
      # 站点域名取自 .env 的 QT_SITE，必须与 QT_BASE_URL 是同一个域名；未设置时 Caddy 因配置无效而启动失败
      QT_SITE: ${QT_SITE:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与账号数据：务必保留，否则重建后要重新申请（有频率限制）
      - caddy_data:/data
      - caddy_config:/config

volumes:
  qt_pg:
  caddy_data:
  caddy_config:
